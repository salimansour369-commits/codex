[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impress-engine"
version = "0.1.0"
description = "A composable async pipeline engine with retries, hooks, and pluggable stages."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Codex"}]
license = {text = "MIT"}
keywords = ["pipeline", "async", "engineering", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers"
]

[project.scripts]
impress-engine = "impress_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
